# Ubuntu 서버 추론용 Docker Compose
# 환경: AWS g5.xlarge (Ubuntu + NVIDIA GPU)
# 용도: vLLM 추론 + RAG API + 매시간 자동 동기화

services:
  # ==================== vLLM Engine (DeepSeek-R1 Optimized) ====================
  vllm:
    image: vllm/vllm-openai:latest
    container_name: rag-vllm
    privileged: true

    shm_size: "16gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 32G

    environment:
      - VLLM_GPU_MEMORY_UTILIZATION=0.9
      - LLM_MODEL_ID=${LLM_MODEL_ID:-Qwen/Qwen2.5-14B-Instruct-AWQ}
      - VLLM_LOG_LEVEL=INFO
      - VLLM_USE_V1=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all

    volumes:
      - vllm-models:/root/.cache/huggingface
      - vllm-cache:/tmp/vllm-cache

    ports:
      - "8000:8000"

    command:
      - "Qwen/Qwen2.5-14B-Instruct-AWQ"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--served-model-name"
      - "DeepSeek-R1-Distill-8B"
      - "--max-model-len"
      - "8192" # RAG 문맥을 위해 충분한 길이 확보
      - "--gpu-memory-utilization"
      - "0.85" # 14B AWQ는 약 10~12GB VRAM을 사용하므로 0.85면 Reranker용 공간도 충분합니다.
      - "--quantization"
      - "awq"
      - "--dtype"
      - "half"
      - "--enforce-eager" # L4 GPU에서 메모리 관리 최적화
    networks:
      - rag-network

    restart: unless-stopped

  # ==================== ChromaDB Vector Store ====================
  chromadb:
    image: chromadb/chroma:latest
    container_name: rag-chromadb

    environment:
      # ✅ 최신 ChromaDB는 IS_PERSISTENT + PERSIST_DIRECTORY 사용
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=false
      - CHROMA_SERVER_AUTH_ENABLED=false

    volumes:
      # ✅ ChromaDB 기본 경로: /data
      - ./data/chroma:/data

    ports:
      - "8001:8000"

    networks:
      - rag-network

    restart: unless-stopped

  # ==================== RAG API Server ====================
  rag-api:
    image: rag-api-server:latest
    container_name: rag-api

    build:
      context: ./sync-worker
      dockerfile: Dockerfile

    # ✅ GPU 리소스 할당 (Reranker 가속)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    environment:
      # LLM
      - LLM_BACKEND=vllm
      - VLLM_API_URL=http://vllm:8000/v1
      - LLM_MODEL_ID=DeepSeek-R1-Distill-8B

      # ChromaDB
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000

      # 그래프 로드 경로
      - GRAPH_PERSIST_PATH=/app/data/graph.pkl

      # 서버
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8010
      - LOG_LEVEL=INFO
      - SEARCH_TOP_K=5

      # ✅ Reranking 활성화 (정확도 향상)
      - ENABLE_RERANKING=true
      - RERANKER_MODEL=BAAI/bge-reranker-v2-m3
      - RERANKER_TOP_K=10

    volumes:
      - ./sync-worker/src:/app/src
      - ./data:/app/data

    ports:
      - "8010:8010"

    networks:
      - rag-network

    command: python -u src/server.py

    depends_on:
      - vllm
      - chromadb

    restart: unless-stopped

  # ==================== Open WebUI ====================
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: rag-webui

    environment:
      - DEFAULT_MODEL=DeepSeek-R1-Distill-8B
      - OPENAI_API_BASE_URL=http://rag-api:8010/v1
      - OPENAI_API_KEY=sk-not-needed
      - WEBUI_NAME="Enterprise RAG Chat"
      - WEBUI_URL=http://localhost:3000
      - WEBUI_AUTH_ENABLED=false
      - WEBUI_DEFAULT_USER_ROLE=admin
      - WEBUI_DEFAULT_MODELS=DeepSeek-R1-Distill-8B
      - ENABLE_MODEL_FILTER=true
      - MODEL_FILTER_LIST=DeepSeek-R1-Distill-8B
      - ENABLE_MODEL_CHANGER=false
      - SHOW_ADMIN_DETAILS=false
      - ENABLE_OLLAMA_API=false
      - ENABLE_OPENAI_API=true
      - QUERY_TIMEOUT=120
      - DATABASE_URL=sqlite:////app/backend/data/webui.db
      - SCOPED_FILE_UPLOAD_MAX_SIZE_MB=100
      - ENABLE_OAUTH_SIGNUP=false
      # ✅ 불필요한 Task 기능 비활성화 (LLM 호출 절약)
      - ENABLE_FOLLOW_UP_GENERATION=false
      - ENABLE_TAGS_GENERATION=false
      - ENABLE_TITLE_GENERATION=false

    volumes:
      - webui-data:/app/backend/data

    ports:
      - "3000:8080"

    networks:
      - rag-network

    depends_on:
      rag-api:
        condition: service_healthy

    restart: unless-stopped

  # ==================== Sync Worker (Batch Job) ====================
  sync-worker:
    image: rag-sync-worker:latest
    container_name: rag-sync

    # 수동 실행 전용 (docker compose up에서 자동 실행 안 됨)
    profiles: ["batch-job"]

    build:
      context: ./sync-worker
      dockerfile: Dockerfile

    environment:
      # ChromaDB
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000

      # Notion
      - NOTION_TOKEN=${NOTION_TOKEN}
      - NOTION_DATABASE_ID=${NOTION_DATABASE_ID:-}

      # 그래프 저장 경로
      - GRAPH_PERSIST_PATH=/app/data/graph.pkl

      # 동기화 설정 (1회만 실행)
      - SYNC_ONCE=true
      - LOG_LEVEL=INFO

    volumes:
      - ./sync-worker/src:/app/src
      - ./data:/app/data

    networks:
      - rag-network

    command: python -u src/main.py --once

  # ==================== Ollama (CPU Backup) ====================
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    profiles: ["ollama-backup"]

    environment:
      - OLLAMA_MODELS=/root/.ollama/models

    volumes:
      - ollama-models:/root/.ollama

    ports:
      - "11434:11434"

    networks:
      - rag-network

    restart: unless-stopped

networks:
  rag-network:
    driver: bridge

volumes:
  vllm-models:
    driver: local
  vllm-cache:
    driver: local
  webui-data:
    driver: local
  ollama-models:
    driver: local
