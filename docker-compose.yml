version: "3.8"

services:
  # vLLM Engine - GPU 최적화 LLM
  vllm:
    image: vllm/vllm-openai:latest
    container_name: rag-vllm
    ports:
      - "8000:8000"
    volumes:
      - ./data/vllm-models:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      serve "unsloth/DeepSeek-R1-Distill-Qwen-14B-AWQ"
      --port 8000
      --max-model-len 8192
      --gpu-memory-utilization 0.9
      --trust-remote-code
      --quantization awq
      --dtype half
      --enable-reasoning
      --reasoning-parser deepseek_r1
    restart: unless-stopped
    networks:
      - rag-network
    # profiles 부분은 수동 실행이 필요하므로, 자동 실행을 원하시면 제거하세요.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Ollama - CPU 최적화 LLM
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "0.0.0.0:11434:11434" # ✅ 수정: 127.0.0.1 제거
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=0
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MEMORY_FRACTION=0.8
    restart: unless-stopped
    networks:
      - rag-network
    entrypoint: /bin/bash -c "ollama serve & sleep 5 && ollama pull mistral && wait"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    profiles:
      - ollama

  # ChromaDB - Vector 데이터베이스
  chromadb:
    image: chromadb/chroma:latest
    container_name: rag-chromadb
    ports:
      - "0.0.0.0:8001:8000" # ✅ 수정: 127.0.0.1 제거
    volumes:
      - ./data/chromadb:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    networks:
      - rag-network

  # Sync Worker - Notion/Gitea/GitHub 동기화
  sync-worker:
    build:
      context: ./sync-worker
      dockerfile: Dockerfile
    container_name: rag-sync-worker
    environment:
      - PYTHONPATH=/app/src
      - NOTION_TOKEN=${NOTION_TOKEN}
      - NOTION_DATABASE_ID=${NOTION_DATABASE_ID}
      - GITEA_URL=${GITEA_URL}
      - GITEA_TOKEN=${GITEA_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_ORGS=${GITHUB_ORGS}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - SYNC_INTERVAL=${SYNC_INTERVAL:-300}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LLM_BACKEND=${LLM_BACKEND:-auto}
    depends_on:
      - chromadb
    restart: unless-stopped
    networks:
      - rag-network

  # RAG Inference API Server - FastAPI
  rag-api:
    build:
      context: ./sync-worker
      dockerfile: Dockerfile
    container_name: rag-api-server
    command: uvicorn src.server:app --host 0.0.0.0 --port 9000
    ports:
      - "0.0.0.0:9000:9000" # ✅ 수정: 127.0.0.1 제거
    environment:
      - PYTHONPATH=/app/src
      - VLLM_API_URL=${VLLM_API_URL:-http://vllm:8000/v1}
      - OLLAMA_API_URL=${OLLAMA_API_URL:-http://ollama:11434}
      - LLM_BACKEND=${LLM_BACKEND:-vllm} # ✅ auto → vllm으로 변경 (기본값)
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - SEARCH_TOP_K=${SEARCH_TOP_K:-5}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=9000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - chromadb
    restart: unless-stopped
    networks:
      - rag-network

  # Open WebUI - RAG 웹 인터페이스
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: rag-webui
    ports:
      - "0.0.0.0:3000:8080"
    volumes:
      - ./data/open-webui:/app/backend/data
    environment:
      # ✅ 이 부분이 중요!
      - OPENAI_API_BASE_URL=http://rag-api:9000/v1
      - OPENAI_API_KEY=sk-default
      - WEBUI_AUTH=false
      - WEBUI_TRUSTED_HEADER_AUTH_ENABLED=false

    restart: unless-stopped
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
